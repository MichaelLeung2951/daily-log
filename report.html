<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Monthly Report · Daily Log</title>
  <meta name="description" content="Monthly overview of all logged activities." />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <style>
    body, header, div, button { transition: background-color .2s, border-color .2s, color .2s; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen font-sans antialiased">

  <!-- ===== Header ===== -->
  <header class="sticky top-0 z-20 bg-indigo-600 dark:bg-indigo-800 text-white shadow-md">
    <div class="max-w-xl mx-auto px-4 pt-3 pb-3" style="padding-top: max(0.75rem, env(safe-area-inset-top));">
      <div class="flex items-center justify-between">
        <a href="index.html" class="p-2 -ml-2 rounded-full hover:bg-white/20 active:bg-white/30 min-w-[44px] min-h-[44px] flex items-center justify-center" aria-label="Back to Daily Log">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <h1 class="text-lg font-bold flex items-center gap-2">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Monthly Report
        </h1>
        <button id="themeToggle" class="p-2 -mr-2 rounded-full hover:bg-white/20 active:bg-white/30 min-w-[44px] min-h-[44px] flex items-center justify-center" aria-label="Toggle dark mode">
          <svg id="iconSun" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.2 4.2l1.4 1.4m12.8 12.8l1.4 1.4M1 12h2m18 0h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
          <svg id="iconMoon" class="w-6 h-6 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>

      <!-- Month navigation -->
      <div class="mt-3 flex items-center gap-2">
        <button id="prevMonth" class="p-2.5 rounded-lg bg-white/15 hover:bg-white/25 active:bg-white/35 min-w-[44px] min-h-[44px] flex items-center justify-center" aria-label="Previous month">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="flex-1 text-center font-semibold text-lg" id="monthLabel"></div>
        <button id="nextMonth" class="p-2.5 rounded-lg bg-white/15 hover:bg-white/25 active:bg-white/35 min-w-[44px] min-h-[44px] flex items-center justify-center" aria-label="Next month">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 py-4 pb-16 space-y-6">

    <!-- ===== Summary cards ===== -->
    <section class="grid grid-cols-2 gap-3">
      <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm p-4">
        <p class="text-xs text-slate-400 dark:text-slate-500 font-medium">Activities</p>
        <p id="statCount" class="text-2xl font-bold text-indigo-600 dark:text-indigo-400 mt-1">0</p>
      </div>
      <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm p-4">
        <p class="text-xs text-slate-400 dark:text-slate-500 font-medium">Total logged time</p>
        <p id="statTime" class="text-2xl font-bold text-indigo-600 dark:text-indigo-400 mt-1">0m</p>
      </div>
      <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm p-4">
        <p class="text-xs text-slate-400 dark:text-slate-500 font-medium">Active days</p>
        <p id="statDays" class="text-2xl font-bold text-indigo-600 dark:text-indigo-400 mt-1">0</p>
      </div>
      <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm p-4">
        <p class="text-xs text-slate-400 dark:text-slate-500 font-medium">Busiest day</p>
        <p id="statBusy" class="text-2xl font-bold text-indigo-600 dark:text-indigo-400 mt-1">–</p>
      </div>
    </section>

    <!-- ===== Daily activity chart ===== -->
    <section class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm p-4">
      <h2 class="font-semibold mb-1">Daily Activities</h2>
      <p class="text-xs text-slate-400 dark:text-slate-500 mb-3">Number of logged activities per day (tap and hold a bar for details).</p>
      <div id="dailyChart" class="flex items-end gap-[2px] h-32"></div>
      <div id="dailyAxis" class="flex justify-between text-[10px] text-slate-400 dark:text-slate-500 mt-1 px-0.5"></div>
    </section>

    <!-- ===== Category breakdown ===== -->
    <section class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm p-4">
      <h2 class="font-semibold mb-3">By Category</h2>
      <div id="catBreakdown" class="space-y-3"></div>
    </section>

    <!-- ===== Medicine adherence ===== -->
    <section class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm p-4">
      <h2 class="font-semibold mb-1">💊 Medicine Adherence</h2>
      <p class="text-xs text-slate-400 dark:text-slate-500 mb-3">One dot per day — green = taken, gray = missed.</p>
      <div id="medAdherence" class="space-y-3"></div>
    </section>

    <!-- ===== Quick-log highlights ===== -->
    <section class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm p-4">
      <h2 class="font-semibold mb-3">Quick-log Highlights</h2>
      <div id="highlights" class="grid grid-cols-2 gap-3"></div>
    </section>
  </main>

  <script src="report.js"></script>
</body>
</html>
